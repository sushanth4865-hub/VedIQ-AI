spring:
  application:
    name: vediq

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vediq}
    username: ${DB_USERNAME:ssc_ai_user}
    password: ${DB_PASSWORD:ssc_ai_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always